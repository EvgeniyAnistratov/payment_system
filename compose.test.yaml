# Separate PostgreSQL for pytest. Does not use the development database.
# Start: docker-compose --env-file .env.test -f compose.test.yaml up -d
services:
  test_postgres:
    image: postgres:18.1-alpine
    container_name: payment_system_test_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Postgres 18 keeps cluster data under /var/lib/postgresql.
      - ./.test-data/postgres:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
