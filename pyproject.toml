[project]
name = "payment-system"
version = "0.1.0"
description = ""
authors = [
    {name = "EvgeniyAnistratov"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "python-utils @ git+https://github.com/EvgeniyAnistratov/python_utils.git",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.43.0,<0.44.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "python-multipart (>=0.0.24,<0.0.25)",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "import-linter (>=2.16,<3.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [".", "src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

# The legacy app package stays outside these contracts until it is removed.
# src.main is optional until the composition root moves there.
# Do not set exhaustive = true before that.
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "(src.main)",
    "src.bootstrap",
    "src.presentation | src.infrastructure",
    "src.application",
    "src.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are framework-free"
type = "forbidden"
source_modules = ["src.domain", "src.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "jwt",
    "bcrypt",
    "dishka",
]

[[tool.importlinter.contracts]]
name = "Presentation does not use persistence details"
type = "forbidden"
source_modules = ["src.presentation"]
forbidden_modules = ["sqlalchemy", "jwt", "bcrypt"]
